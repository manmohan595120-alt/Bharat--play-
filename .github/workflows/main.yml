name: Play APK & AAB Builder

on:
  workflow_dispatch: # इसे आप मैन्युअली (हाथ से) रन कर सकते हैं

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. सबसे पहले रिपोजिटरी का कोड डाउनलोड करने के लिए (यह स्टेप गायब था)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. जावा सेटअप करने के लिए (लेटेस्ट वर्जन v4 के साथ ताकि एरर न आए)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' # आप अपनी जरूरत के हिसाब से temurin या zulu रख सकते हैं
          java-version: '17'
          cache: 'gradle' # इससे अगली बार बिल्ड तेजी से होगा

      # 3. ग्रेडल (Gradle) को फाइलें रन करने की परमिशन देने के लिए
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. APK बिल्ड करने के लिए कमांड
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 5. तैयार हुए APK को सेव (Artifact) करने के लिए ताकि आप इसे डाउनलोड कर सकें
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
