name: Bharat Play APK & AAB Builder

on:
  push:
    branches: [ "main", "master" ] # जब आप main या master पर पुश करेंगे तब यह चलेगा
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # इससे आप मैन्युअल रूप से भी बटन दबाकर रन कर सकते हैं

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. कोड को GitHub रनर पर डाउनलोड करना
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. जावा सेटअप करना (Android बिल्ड के लिए ज़रूरी है)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Gradle फाइल्स को परमिशन देना
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        # अगर आपका कोड किसी सब-फोल्डर (जैसे android/) में है, तो इसे बदलें: run: chmod +x android/gradlew

      # 4. AAB (App Bundle) फाइल को बिल्ड करना (ताकि फाइल जेनरेट हो सके)
      - name: Build Android App Bundle (AAB)
        run: ./gradlew bundleRelease
        # अगर सब-फोल्डर में है, तो लिखें: run: cd android && ./gradlew bundleRelease

      # 5. नई जेनरेट हुई AAB फ़ाइल को खोजना और उसे नाम देना
      - name: Locate and Check AAB File
        run: |
          echo "Looking for generated AAB files..."
          # यह कमांड पूरे प्रोजेक्ट में कहीं भी बनी .aab फाइल को ढूंढ निकालेगी
          AAB_PATH=$(find . -name "*.aab" -print -quit)
          
          if [ -z "$AAB_PATH" ]; then
            echo "::error::Error: No AAB file was found anywhere in the project build outputs!"
            exit 1
          else
            echo "Success: Found AAB at $AAB_PATH"
            # इसे एक एनवायरनमेंट वेरिएबल में सेव कर रहे हैं ताकि अगले स्टेप्स में इस्तेमाल हो सके
            echo "GENERATED_AAB_PATH=$AAB_PATH" >> $GITHUB_ENV
          fi

      # 6. (वैकल्पिक) अगर आप AAB फाइल को GitHub पर अपलोड करके डाउनलोड करना चाहते हैं
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bharat-Play-AAB
          path: ${{ env.GENERATED_AAB_PATH }}
