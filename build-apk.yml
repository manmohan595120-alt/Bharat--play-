name: Bharat Play APK Build

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Download website manifest
        # Line 9 ko fix kiya (added " at the end):
        run: curl -fL "https://manmohan595120-alt.github.io/Bharat--play-/" -o manifest.json

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: bharat-play-manifest
          path: manifest.json

  # Iske neeche aapki 'build' job hogi, use check karein:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Agar aapka project root par nahi hai, toh cache hata dein ya proper path dein
