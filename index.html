<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087f5b">
<title>Bharat Play</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#222}
header{background:#087f5b;color:white;padding:22px 16px}
header h1{margin:0;font-size:28px}
header p{margin-bottom:0}
.search{padding:14px;background:white}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:25px;font-size:16px}
#categories{display:flex;gap:8px;overflow:auto;padding:12px}
.cat{padding:10px 15px;border:1px solid #ddd;border-radius:20px;background:white;white-space:nowrap}
.cat.active{background:#087f5b;color:white}
h2{margin:15px;font-size:20px}
#count{padding:0 15px;color:#666;font-size:13px}
#apps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px}
.card{background:white;padding:13px;border-radius:13px;box-shadow:0 2px 7px #ddd;overflow-wrap:anywhere}
.icon{font-size:34px}
.card h3{font-size:16px;margin:8px 0}
.card p{font-size:13px;color:#666;min-height:32px}
.card a{display:block;text-decoration:none;text-align:center;background:#087f5b;color:white;padding:11px 5px;border-radius:8px;margin-top:8px;font-size:13px}
.card a.store{background:#e7f4ec;color:#087f5b}
footer{text-align:center;padding:25px;color:#666}
@media(min-width:650px){#apps{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>

<header>
<h1>🇮🇳 Bharat Play</h1>
<p>आपकी पसंदीदा ऐप्स एक ही जगह!</p>
</header>

<div class="search">
<input id="search" type="search" placeholder="🔍 ऐप खोजें...">
</div>

<div id="categories"></div>
<h2>Popular Apps & Games</h2>
<div id="count"></div>
<div id="apps"></div>
<footer>Bharat Play © 2026</footer>

<script>
const data=[
["WhatsApp","Social","मैसेज और कॉल","💬","https://www.whatsapp.com"],
["YouTube","Video","वीडियो देखें","▶️","https://www.youtube.com"],
["Instagram","Social","फोटो और रील्स","📸","https://www.instagram.com"],
["Facebook","Social","दोस्तों से जुड़ें","🔵","https://www.facebook.com"],
["Telegram","Social","मैसेज और चैनल","✈️","https://telegram.org"],
["Chrome","Tools","इंटरनेट ब्राउज़ करें","🌐","https://www.google.com/chrome"],
["Google Maps","Travel","मैप और रास्ते","🗺️","https://maps.google.com"],
["Gmail","Productivity","ईमेल भेजें","✉️","https://mail.google.com"],
["Google Drive","Productivity","फाइल सेव करें","📁","https://drive.google.com"],
["Google Photos","Photography","फोटो संभालें","🌄","https://photos.google.com"],
["Google Pay","Finance","डिजिटल पेमेंट","💳","https://pay.google.com"],
["PhonePe","Finance","पेमेंट और रिचार्ज","💜","https://www.phonepe.com"],
["Paytm","Finance","पेमेंट सेवाएं","💰","https://paytm.com"],
["Amazon","Shopping","ऑनलाइन खरीदारी","📦","https://www.amazon.in"],
["Flipkart","Shopping","ऑनलाइन शॉपिंग","🛍️","https://www.flipkart.com"],
["Meesho","Shopping","प्रोडक्ट खरीदें","🛒","https://www.meesho.com"],
["Snapchat","Social","फोटो शेयर करें","👻","https://www.snapchat.com"],
["Spotify","Music","म्यूजिक सुनें","🎵","https://www.spotify.com"],
["Netflix","Entertainment","फिल्में और शो","🎬","https://www.netflix.com"],
["JioHotstar","Entertainment","शो और स्पोर्ट्स","📺","https://www.hotstar.com"],
["Jio","Tools","Jio सेवाएं","📱","https://www.jio.com"],
["Airtel","Tools","Airtel सेवाएं","📶","https://www.airtel.in"],
["IRCTC","Travel","ट्रेन टिकट","🚆","https://www.irctc.co.in"],
["Uber","Travel","राइड बुक करें","🚕","https://www.uber.com"],
["Swiggy","Food","खाना ऑर्डर करें","🍔","https://www.swiggy.com"],
["Zomato","Food","रेस्टोरेंट खोजें","🍕","https://www.zomato.com"],
["Canva","Tools","डिजाइन बनाएं","🎨","https://www.canva.com"],
["Microsoft Word","Productivity","डॉक्यूमेंट बनाएं","📝","https://www.microsoft.com"],
["Zoom","Communication","वीडियो मीटिंग","📹","https://zoom.us"],
["Discord","Social","चैट और कम्युनिटी","🎮","https://discord.com"],
["Pinterest","Social","नए आइडिया खोजें","📌","https://www.pinterest.com"],
["Wikipedia","Education","जानकारी पढ़ें","📚","https://www.wikipedia.org"],
["Duolingo","Education","भाषाएं सीखें","🦉","https://www.duolingo.com"],
["Khan Academy","Education","मुफ्त पढ़ाई","🎓","https://www.khanacademy.org"],
["Roblox","Games","गेम खेलें","🎮","https://www.roblox.com"],
["Minecraft","Games","दुनिया बनाएं","🧱","https://www.minecraft.net"],
["Chess.com","Games","शतरंज खेलें","♟️","https://www.chess.com"],
["Ludo King","Games","लूडो खेलें","🎲","https://ludoking.com"],
["Subway Surfers","Games","रनिंग गेम","🏃","https://subwaysurfers.com"],
["BookMyShow","Entertainment","टिकट बुक करें","🎟️","https://in.bookmyshow.com"],
["OLX","Shopping","खरीदें और बेचें","🏷️","https://www.olx.in"],
["Naukri","Productivity","नौकरी खोजें","💼","https://www.naukri.com"],
["DigiLocker","Tools","डिजिटल डॉक्यूमेंट","🪪","https://www.digilocker.gov.in"],
["UMANG","Tools","सरकारी सेवाएं","🇮🇳","https://web.umang.gov.in"],
["Google Translate","Tools","भाषा अनुवाद","🌐","https://translate.google.com"],
["Google Meet","Communication","वीडियो कॉल","📹","https://meet.google.com"],
["Google Calendar","Productivity","कैलेंडर","🗓️","https://calendar.google.com"],
["Adobe Acrobat","Productivity","PDF दस्तावेज","📄","https://www.adobe.com/acrobat.html"],
["CapCut","Photography","वीडियो एडिट करें","✂️","https://www.capcut.com"],
["VLC","Entertainment","वीडियो प्लेयर","▶️","https://www.videolan.org/vlc"]
];

let category="All";

function renderCategories(){
 const box=document.getElementById("categories");
 box.innerHTML="";
 const cats=["All",...new Set(data.map(a=>a[1]))];

 cats.forEach(c=>{
  const b=document.createElement("button");
  b.className="cat"+(category===c?" active":"");
  b.textContent=c==="All"?"सभी":c;
  b.onclick=()=>{
   category=c;
   renderCategories();
   renderApps();
  };
  box.appendChild(b);
 });
}

function renderApps(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 const list=data.filter(a=>
  (category==="All"||a[1]===category)&&
  a.join(" ").toLowerCase().includes(q)
 );

 const box=document.getElementById("apps");
 box.innerHTML="";

 list.forEach(a=>{
  const card=document.createElement("div");
  card.className="card";

  const icon=document.createElement("div");
  icon.className="icon";
  icon.textContent=a[3];

  const h=document.createElement("h3");
  h.textContent=a[0];

  const p=document.createElement("p");
  p.textContent=a[2];

  const open=document.createElement("a");
  open.href=a[4];
  open.target="_blank";
  open.rel="noopener noreferrer";
  open.textContent="Official Website";

  const store=document.createElement("a");
  store.className="store";
  store.href="https://play.google.com/store/search?q="+encodeURIComponent(a[0])+"&c=apps";
  store.target="_blank";
  store.rel="noopener noreferrer";
  store.textContent="Play Store पर खोजें";

  card.append(icon,h,p,open,store);
  box.appendChild(card);
 });

 document.getElementById("count").textContent="कुल "+list.length+" ऐप्स";
}

document.getElementById("search").addEventListener("input",renderApps);
renderCategories();
renderApps();
</script>

</body>
</html>
