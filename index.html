<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bharat Play</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  color: #222;
}

header {
  background: #087443;
  color: white;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin-bottom: 0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 16px;
}

.box {
  background: white;
  padding: 18px;
  border-radius: 12px;
  margin: 16px 0;
  box-shadow: 0 2px 8px #00000012;
}

input, textarea, button {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 16px;
}

button {
  background: #087443;
  color: white;
  border: none;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
}

.secondary {
  background: #555;
}

.delete {
  background: #c62828;
}

.app {
  border: 1px solid #ddd;
  padding: 14px;
  border-radius: 10px;
  margin: 12px 0;
  background: white;
}

.app h3 {
  margin-top: 0;
}

.app a {
  color: #087443;
  overflow-wrap: anywhere;
}

.status {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 14px;
}

.hidden {
  display: none;
}

footer {
  text-align: center;
  padding: 20px;
  color: #666;
}
</style>
</head>

<body>

<header>
  <h1>🇮🇳 Bharat Play</h1>
  <p>Discover Apps Made for India</p>
</header>

<div class="container">

  <div class="box">
    <h2>🔍 Search Apps</h2>

    <input
      type="search"
      id="searchInput"
      placeholder="Search apps..."
    >

    <p id="appStatus" class="status">
      Loading apps...
    </p>

    <div id="appList"></div>
  </div>

  <div class="box" id="loginBox">
    <h2>🔐 Admin Login</h2>

    <form id="loginForm">
      <input
        type="email"
        id="email"
        placeholder="Admin Email"
        autocomplete="username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginBtn">
        Login
      </button>
    </form>

    <button type="button"
      id="resetBtn"
      class="secondary">
      Reset Password
    </button>

    <p id="status" class="status"></p>
  </div>

  <div class="box hidden" id="adminPanel">
    <h2>⚙️ Admin Panel</h2>

    <p>Welcome, Admin!</p>

    <h3>Add New App</h3>

    <form id="addAppForm">

      <input
        type="text"
        id="appName"
        placeholder="App Name"
        required
      >

      <textarea
        id="appDescription"
        placeholder="App Description"
        required
      ></textarea>

      <input
        type="url"
        id="appUrl"
        placeholder="App Website or Download URL (https://...)"
        required
      >

      <button type="submit" id="addBtn">
        Add App
      </button>

    </form>

    <button id="logoutBtn" class="secondary">
      Logout
    </button>

    <p id="adminStatus" class="status"></p>
  </div>

</div>

<footer>
  <p>© 2026 Bharat Play | Made in India 🇮🇳</p>
</footer>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  deleteDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// Firebase Configuration
// Keep your actual Firebase API key here.

const firebaseConfig = {
  apiKey: "AIzaSyBwvt-G96rkGNeUXQQvcJjPPvWhSIHc8Hc",
  authDomain: "bharat--play.firebaseapp.com",
  projectId: "bharat--play",
  storageBucket: "bharat--play.firebasestorage.app",
  messagingSenderId: "1052808095459",
  appId: "1:1052808095459:web:86b4125fda3bbfaee707d6",
  measurementId: "G-S2SF10GYD8"
};


// Admin email
const ADMIN_EMAIL = "manmohan595120@gmail.com";

const $ = id => document.getElementById(id);

let auth;
let db;
let isAdmin = false;
let allApps = [];

function setStatus(message) {
  $("status").textContent = message;
}

function validHttpUrl(value) {
  try {
    const url = new URL(value);

    if (url.protocol === "https:" ||
        url.protocol === "http:") {
      return url.href;
    }
  } catch (error) {}

  return null;
}


// Show apps on the website
function showApps() {
  const list = $("appList");
  list.replaceChildren();

  const search = $("searchInput").value
    .trim()
    .toLowerCase();

  const filtered = allApps.filter(app => {
    const name = String(app.name || "").toLowerCase();
    const description =
      String(app.description || "").toLowerCase();

    return name.includes(search) ||
           description.includes(search);
  });

  if (filtered.length === 0) {
    list.textContent = "No apps found.";
    return;
  }

  filtered.forEach(app => {
    const card = document.createElement("div");
    card.className = "app";

    const title = document.createElement("h3");
    title.textContent = app.name || "Unnamed App";

    const description = document.createElement("p");
    description.textContent = app.description || "";

    card.append(title, description);

    const safeUrl = validHttpUrl(app.url || "");

    if (safeUrl) {
      const link = document.createElement("a");

      link.href = safeUrl;
      link.textContent = "Open / Download App";
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      card.appendChild(link);
    }

    if (isAdmin) {
      const deleteButton =
        document.createElement("button");

      deleteButton.className = "delete";
      deleteButton.textContent = "Delete App";

      deleteButton.addEventListener("click", async () => {
        const confirmed = confirm(
          "Are you sure you want to delete this app?"
        );

        if (!confirmed) return;

        try {
          await deleteDoc(doc(db, "apps", app.id));

          $("adminStatus").textContent =
            "App deleted successfully.";

          await loadApps();

        } catch (error) {
          $("adminStatus").textContent =
            "Delete error: " + error.message;
        }
      });

      card.appendChild(deleteButton);
    }

    list.appendChild(card);
  });
}


// Load apps from Firestore
async function loadApps() {
  $("appStatus").textContent = "Loading apps...";

  try {
    const snapshot = await getDocs(
      collection(db, "apps")
    );

    allApps = snapshot.docs.map(item => ({
      id: item.id,
      ...item.data()
    }));

    allApps.sort((a, b) => {
      const timeA = a.createdAt?.seconds || 0;
      const timeB = b.createdAt?.seconds || 0;

      return timeB - timeA;
    });

    showApps();

    $("appStatus").textContent =
      allApps.length + " app(s) available.";

  } catch (error) {
    $("appStatus").textContent =
      "Could not load apps. Check Firestore rules. " +
      error.code;

    console.error("Load apps error:", error);
  }
}


// Login
$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    setStatus("Enter email and password.");
    return;
  }

  $("loginBtn").disabled = true;
  setStatus("Signing in...");

  try {
    const result = await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    if (
      result.user.email.toLowerCase() !==
      ADMIN_EMAIL.toLowerCase()
    ) {
      await signOut(auth);

      setStatus("This email is not the admin email.");
      return;
    }

    setStatus("Login successful.");

  } catch (error) {
    setStatus(
      "Login failed: " +
      (error.code || error.message)
    );

    console.error("Login error:", error);

  } finally {
    $("loginBtn").disabled = false;
  }
});


// Reset password
$("resetBtn").addEventListener("click", async () => {
  const email = $("email").value.trim();

  if (!email) {
    setStatus("Enter your email first.");
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);

    setStatus(
      "If the account is eligible, a password reset email has been sent. Check Spam too."
    );

  } catch (error) {
    setStatus(
      "Reset error: " +
      (error.code || error.message)
    );

    console.error("Password reset error:", error);
  }
});


// Add app
$("addAppForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!isAdmin) {
    $("adminStatus").textContent =
      "Please log in as admin first.";
    return;
  }

  const name = $("appName").value.trim();
  const description =
    $("appDescription").value.trim();

  const url = validHttpUrl(
    $("appUrl").value.trim()
  );

  if (!url) {
    $("adminStatus").textContent =
      "Enter a valid http or https URL.";
    return;
  }

  $("addBtn").disabled = true;

  try {
    await addDoc(collection(db, "apps"), {
      name,
      description,
      url,
      createdAt: serverTimestamp()
    });

    $("addAppForm").reset();

    $("adminStatus").textContent =
      "App added successfully!";

    await loadApps();

  } catch (error) {
    $("adminStatus").textContent =
      "Add error: " +
      (error.code || error.message);

    console.error("Add app error:", error);

  } finally {
    $("addBtn").disabled = false;
  }
});


// Search
$("searchInput").addEventListener("input", showApps);


// Logout
$("logoutBtn").addEventListener("click", async () => {
  try {
    await signOut(auth);
    setStatus("Logged out successfully.");
  } catch (error) {
    $("adminStatus").textContent = error.message;
  }
});


// Initialize Firebase
try {
  const app = initializeApp(firebaseConfig);

  auth = getAuth(app);
  db = getFirestore(app);

  onAuthStateChanged(auth, async user => {
    isAdmin = Boolean(
      user &&
      user.email &&
      user.email.toLowerCase() ===
      ADMIN_EMAIL.toLowerCase()
    );

    $("adminPanel").classList.toggle(
      "hidden",
      !isAdmin
    );

    $("loginBox").classList.toggle(
      "hidden",
      isAdmin
    );

    if (isAdmin) {
      $("status").textContent =
        "Admin login successful.";
    }

    showApps();

    await loadApps();
  });

} catch (error) {
  setStatus(
    "Firebase setup error: " + error.message
  );

  $("appStatus").textContent =
    "Firebase setup error.";

  console.error("Firebase setup error:", error);
}

</script>

</body>
</html>
