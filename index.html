
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087f5b">

<title>Bharat Play - Apps & Games</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7f8;
  color: #202124;
}

header {
  background: #087f5b;
  color: white;
  padding: 18px 15px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.logo {
  font-size: 23px;
  font-weight: bold;
}

.admin-btn {
  border: 1px solid white;
  color: white;
  background: transparent;
  padding: 9px 12px;
  border-radius: 20px;
}

.search {
  width: 100%;
  margin-top: 16px;
  padding: 14px;
  border: none;
  border-radius: 25px;
  font-size: 16px;
  outline: none;
}

main {
  padding: 16px;
  max-width: 1100px;
  margin: auto;
}

h2 {
  font-size: 20px;
}

.categories {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding: 5px 0 15px;
}

.category {
  flex-shrink: 0;
  border: 1px solid #ddd;
  background: white;
  padding: 10px 15px;
  border-radius: 22px;
}

.category.active {
  background: #087f5b;
  color: white;
  border-color: #087f5b;
}

.app-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 13px;
}

.app-card {
  background: white;
  padding: 15px 10px;
  border-radius: 15px;
  box-shadow: 0 2px 7px #0000000c;
  text-align: center;
  min-width: 0;
}

.app-icon {
  width: 58px;
  height: 58px;
  margin: 0 auto 10px;
  border-radius: 16px;
  background: #e1f5ec;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
}

.app-card h3 {
  font-size: 15px;
  margin: 8px 0;
  overflow-wrap: anywhere;
}

.app-card p {
  font-size: 12px;
  color: #666;
  min-height: 30px;
  overflow-wrap: anywhere;
}

.download {
  display: inline-block;
  background: #087f5b;
  color: white;
  padding: 10px 12px;
  text-decoration: none;
  border-radius: 20px;
  font-size: 13px;
  margin-top: 6px;
}

.panel {
  background: white;
  padding: 18px;
  border-radius: 15px;
  margin: 20px 0;
  box-shadow: 0 2px 8px #00000012;
}

.panel input,
.panel textarea,
.panel select {
  width: 100%;
  padding: 12px;
  margin: 7px 0 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
}

.panel button {
  border: none;
  padding: 12px 16px;
  background: #087f5b;
  color: white;
  border-radius: 8px;
  margin: 4px;
}

.danger {
  background: #c62828 !important;
}

.hidden {
  display: none;
}

.status {
  font-size: 14px;
  overflow-wrap: anywhere;
}

footer {
  background: #e9efec;
  text-align: center;
  padding: 22px 10px;
  margin-top: 30px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">🇮🇳 Bharat Play</div>
    <button class="admin-btn" id="loginOpen">Admin Login</button>
  </div>

  <input
    class="search"
    id="search"
    type="search"
    placeholder="🔍 Search apps and games..."
  >
</header>

<main>

  <section id="loginPanel" class="panel hidden">
    <h2>Admin Login</h2>

    <label>Email</label>
    <input id="email" type="email"
           placeholder="Admin email">

    <label>Password</label>
    <input id="password" type="password"
           placeholder="Password">

    <button id="loginBtn">Login</button>
    <button id="resetBtn">Reset Password</button>
    <button id="closeLogin" style="background:#666">
      Close
    </button>

    <p id="loginStatus" class="status"></p>
  </section>

  <section id="adminPanel" class="panel hidden">
    <h2>Admin Panel</h2>
    <p>Welcome, Admin!</p>

    <h3>Add New App</h3>

    <label>App Name</label>
    <input id="appName" placeholder="App name">

    <label>App Description</label>
    <textarea id="appDescription"
      placeholder="Describe this app"></textarea>

    <label>Category</label>
    <select id="appCategory">
      <option>Social</option>
      <option>Education</option>
      <option>Games</option>
      <option>Entertainment</option>
      <option>Tools</option>
      <option>Finance</option>
      <option>Other</option>
    </select>

    <label>App Website or Download URL</label>
    <input id="appUrl" type="url"
      placeholder="https://...">

    <button id="addBtn">Add App</button>
    <button id="logoutBtn" style="background:#555">
      Logout
    </button>

    <p id="adminStatus" class="status"></p>

    <h3>Your Added Apps</h3>
    <div id="adminApps"></div>
  </section>

  <h2>Explore Apps</h2>

  <div class="categories" id="categories">
    <button class="category active" data-category="All">
      All
    </button>
    <button class="category" data-category="Social">
      Social
    </button>
    <button class="category" data-category="Education">
      Education
    </button>
    <button class="category" data-category="Games">
      Games
    </button>
    <button class="category" data-category="Entertainment">
      Entertainment
    </button>
    <button class="category" data-category="Tools">
      Tools
    </button>
    <button class="category" data-category="Finance">
      Finance
    </button>
  </div>

  <div id="appGrid" class="app-grid"></div>

  <p id="emptyMessage" class="hidden">
    No apps found. Try another search.
  </p>

</main>

<footer>
  <strong>Bharat Play</strong>
  <p>Discover apps, games and useful tools.</p>
  <p>Download availability depends on the official provider.</p>
</footer>

<script type="module">

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  deleteDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* Firebase configuration */

const firebaseConfig = {
  apiKey: "AIzaSyBwvt-G96rkGNeUXQQvcJjPPvWhSIHc8Hc",
  authDomain: "bharat--play.firebaseapp.com",
  projectId: "bharat--play",
  storageBucket: "bharat--play.firebasestorage.app",
  messagingSenderId: "1052808095459",
  appId: "1:1052808095459:web:86b4125fda3bbfaee707d6",
  measurementId: "G-S2SF10GYD8"
};

const ADMIN_EMAIL = "manmohan595120@gmail.com";

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);


/* Initial app catalogue.
   These are official websites, not direct APK files. */

const starterApps = [
  {
    name: "YouTube",
    description: "Videos, music and entertainment",
    category: "Entertainment",
    icon: "▶️",
    url: "https://www.youtube.com"
  },
  {
    name: "WhatsApp",
    description: "Messaging and calls",
    category: "Social",
    icon: "💬",
    url: "https://www.whatsapp.com/download"
  },
  {
    name: "Instagram",
    description: "Photos, reels and messages",
    category: "Social",
    icon: "📸",
    url: "https://www.instagram.com"
  },
  {
    name: "Facebook",
    description: "Connect with friends",
    category: "Social",
    icon: "👥",
    url: "https://www.facebook.com"
  },
  {
    name: "Telegram",
    description: "Messaging and channels",
    category: "Social",
    icon: "✈️",
    url: "https://telegram.org"
  },
  {
    name: "Google Maps",
    description: "Maps and navigation",
    category: "Tools",
    icon: "🗺️",
    url: "https://maps.google.com"
  },
  {
    name: "Gmail",
    description: "Email and communication",
    category: "Tools",
    icon: "✉️",
    url: "https://mail.google.com"
  },
  {
    name: "Google Chrome",
    description: "Browse the internet",
    category: "Tools",
    icon: "🌐",
    url: "https://www.google.com/chrome"
  },
  {
    name: "Google Meet",
    description: "Video meetings and calls",
    category: "Education",
    icon: "📹",
    url: "https://meet.google.com"
  },
  {
    name: "Google Classroom",
    description: "Learning and classroom tools",
    category: "Education",
    icon: "📚",
    url: "https://classroom.google.com"
  },
  {
    name: "Canva",
    description: "Design posters and presentations",
    category: "Tools",
    icon: "🎨",
    url: "https://www.canva.com"
  },
  {
    name: "Spotify",
    description: "Music and podcasts",
    category: "Entertainment",
    icon: "🎵",
    url: "https://www.spotify.com/download"
  },
  {
    name: "Snapchat",
    description: "Photos and messaging",
    category: "Social",
    icon: "👻",
    url: "https://www.snapchat.com"
  },
  {
    name: "Khan Academy",
    description: "Free educational lessons",
    category: "Education",
    icon: "🎓",
    url: "https://www.khanacademy.org"
  },
  {
    name: "Google Pay",
    description: "Digital payments information",
    category: "Finance",
    icon: "💳",
    url: "https://pay.google.com"
  }
];

let apps = [];
let selectedCategory = "All";
let currentUser = null;
let customApps = [];


/* HTML-safe text */

function safeText(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}


/* Only allow normal HTTPS links */

function validUrl(value) {
  try {
    const parsed = new URL(value);
    return parsed.protocol === "https:";
  } catch {
    return false;
  }
}


/* Load custom apps from Firestore */

async function loadApps() {
  try {
    const snapshot = await getDocs(collection(db, "apps"));

    customApps = snapshot.docs.map(item => ({
      id: item.id,
      ...item.data(),
      custom: true
    }));

    apps = [...starterApps, ...customApps];

  } catch (error) {
    console.error(error);

    apps = [...starterApps];

    document.getElementById("adminStatus").textContent =
      "Saved apps could not be loaded. Check Firestore permissions.";
  }

  renderApps();
  renderAdminApps();
}


/* Display app cards */

function renderApps() {
  const grid = document.getElementById("appGrid");
  const search = document.getElementById("search")
    .value.trim().toLowerCase();

  const filtered = apps.filter(app => {
    const matchesSearch =
      (app.name || "").toLowerCase().includes(search) ||
      (app.description || "").toLowerCase().includes(search);

    const matchesCategory =
      selectedCategory === "All" ||
      app.category === selectedCategory;

    return matchesSearch && matchesCategory;
  });

  grid.innerHTML = filtered.map(app => `
    <article class="app-card">
      <div class="app-icon">
        ${safeText(app.icon || "📱")}
      </div>

      <h3>${safeText(app.name)}</h3>
      <p>${safeText(app.description || "Discover this app")}</p>

      <a class="download"
         href="${validUrl(app.url) ? safeText(app.url) : "#"}"
         target="_blank"
         rel="noopener noreferrer">
        Visit / Download
      </a>
    </article>
  `).join("");

  document.getElementById("emptyMessage")
    .classList.toggle("hidden", filtered.length !== 0);
}


/* Search */

document.getElementById("search").addEventListener("input", renderApps);


/* Categories */

document.querySelectorAll(".category").forEach(button => {
  button.addEventListener("click", () => {
    selectedCategory = button.dataset.category;

    document.querySelectorAll(".category").forEach(item => {
      item.classList.toggle("active", item === button);
    });

    renderApps();
  });
});


/* Admin login panel */

document.getElementById("loginOpen").onclick = () => {
  document.getElementById("loginPanel").classList.toggle("hidden");
};

document.getElementById("closeLogin").onclick = () => {
  document.getElementById("loginPanel").classList.add("hidden");
};

document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const status = document.getElementById("loginStatus");

  if (!email || !password) {
    status.textContent = "Enter email and password.";
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, password);
    status.textContent = "Login successful.";
  } catch (error) {
    status.textContent = "Login failed: " + error.message;
  }
};


/* Password reset */

document.getElementById("resetBtn").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const status = document.getElementById("loginStatus");

  if (!email) {
    status.textContent = "Enter your registered email first.";
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    status.textContent =
      "Password reset email sent. Check your inbox.";
  } catch (error) {
    status.textContent = error.message;
  }
};


/* Admin session */

onAuthStateChanged(auth, user => {
  currentUser = user;

  const isAdmin =
    user && user.email &&
    user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();

  document.getElementById("adminPanel")
    .classList.toggle("hidden", !isAdmin);

  document.getElementById("loginOpen").textContent =
    isAdmin ? "Admin Panel" : "Admin Login";

  if (!isAdmin && user) {
    document.getElementById("loginStatus").textContent =
      "This account is not the configured admin account.";
  }

  renderAdminApps();
});


/* Add app */

document.getElementById("addBtn").onclick = async () => {
  const status = document.getElementById("adminStatus");

  if (!currentUser ||
      currentUser.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
    status.textContent = "Please log in with the admin account.";
    return;
  }

  const name = document.getElementById("appName").value.trim();
  const description =
    document.getElementById("appDescription").value.trim();
  const category = document.getElementById("appCategory").value;
  const url = document.getElementById("appUrl").value.trim();

  if (!name || !description || !url) {
    status.textContent = "Please fill all fields.";
    return;
  }

  if (!validUrl(url)) {
    status.textContent = "Enter a valid HTTPS website or download URL.";
    return;
  }

  try {
    await addDoc(collection(db, "apps"), {
      name,
      description,
      category,
      url,
      createdAt: serverTimestamp()
    });

    status.textContent = "App added successfully!";

    document.getElementById("appName").value = "";
    document.getElementById("appDescription").value = "";
    document.getElementById("appUrl").value = "";

    await loadApps();

  } catch (error) {
    console.error(error);
    status.textContent =
      "App could not be saved. Check Firestore security rules.";
  }
};


/* List custom apps in Admin Panel */

function renderAdminApps() {
  const container = document.getElementById("adminApps");

  const isAdmin =
    currentUser && currentUser.email &&
    currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();

  if (!isAdmin) {
    container.innerHTML = "";
    return;
  }

  if (customApps.length === 0) {
    container.innerHTML = "<p>No custom apps added yet.</p>";
    return;
  }

  container.innerHTML = customApps.map(app => `
    <div class="panel">
      <strong>${safeText(app.name)}</strong>
      <p>${safeText(app.category || "Other")}</p>
      <button class="danger"
        data-delete-id="${safeText(app.id)}">
        Delete App
      </button>
    </div>
  `).join("");

  container.querySelectorAll("[data-delete-id]").forEach(button => {
    button.onclick = async () => {
      if (!confirm("Delete this app from Bharat Play?")) return;

      try {
        await deleteDoc(doc(db, "apps", button.dataset.deleteId));
        document.getElementById("adminStatus").textContent =
          "App deleted.";
        await loadApps();
      } catch (error) {
        document.getElementById("adminStatus").textContent =
          "Could not delete app. Check Firestore permissions.";
      }
    };
  });
}


/* Logout */

document.getElementById("logoutBtn").onclick = async () => {
  await signOut(auth);
  document.getElementById("adminStatus").textContent = "Logged out.";
};


/* Start */

loadApps();

</script>

</body>
</html>
