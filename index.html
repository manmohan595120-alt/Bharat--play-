<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bharat Play</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #202124;
    }

    header {
      background: #087f5b;
      color: white;
      padding: 20px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    header p {
      margin: 0;
    }

    main {
      max-width: 850px;
      margin: 20px auto;
      padding: 0 14px;
    }

    .box {
      background: white;
      padding: 18px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000012;
    }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      font-size: 16px;
      border-radius: 7px;
    }

    input, textarea {
      border: 1px solid #ccc;
    }

    button {
      border: none;
      background: #087f5b;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .secondary {
      background: #475569;
    }

    .danger {
      background: #c62828;
    }

    .card {
      border: 1px solid #e0e0e0;
      padding: 15px;
      border-radius: 10px;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    .card h3 {
      margin-top: 0;
    }

    .hidden {
      display: none;
    }

    #status, #appStatus {
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    a {
      color: #087f5b;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>🇮🇳 Bharat Play</h1>
  <p>Discover apps in one place</p>
</header>

<main>

  <section class="box">
    <h2>Search Apps</h2>
    <input
      id="search"
      type="search"
      placeholder="Search apps..."
      oninput="showApps()"
    >
    <p id="appStatus">Loading apps...</p>
    <div id="appList"></div>
  </section>

  <section class="box">
    <h2>Admin Login</h2>

    <form id="loginForm">
      <input
        id="email"
        type="email"
        placeholder="Admin email"
        autocomplete="username"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button id="loginBtn" type="submit">Login</button>
    </form>

    <button
      id="logoutBtn"
      class="secondary hidden"
      type="button"
    >Logout</button>

    <p id="status" role="status" aria-live="polite">
      Please log in to manage apps.
    </p>
  </section>

  <section id="admin" class="box hidden">
    <h2>Admin Panel</h2>
    <p id="adminEmail"></p>

    <h3>Add New App</h3>

    <form id="appForm">
      <input
        id="appName"
        placeholder="App name"
        required
      >

      <input
        id="appCategory"
        placeholder="Category"
        required
      >

      <textarea
        id="appDescription"
        placeholder="App description"
        required
      ></textarea>

      <input
        id="appUrl"
        type="url"
        placeholder="Official website URL (https://...)"
        required
      >

      <button id="addBtn" type="submit">Add App</button>
    </form>

    <p id="adminStatus"></p>
  </section>

</main>

<footer>
  Bharat Play — Made in India 🇮🇳
</footer>

<script type="module">
  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    deleteDoc,
    doc,
    query,
    orderBy,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Firebase configuration
  // Keep your actual API key from Firebase Config.
  const firebaseConfig = {
    apiKey: // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBwvt-G96rkGNeUXQQvcJjPPvWhSIHc8Hc",
  authDomain: "bharat--play.firebaseapp.com",
  projectId: "bharat--play",
  storageBucket: "bharat--play.firebasestorage.app",
  messagingSenderId: "1052808095459",
  appId: "1:1052808095459:web:86b4125fda3bbfaee707d6",
  measurementId: "G-S2SF10GYD8"
};
    authDomain: "bharat--play.firebaseapp.com",
    projectId: "bharat--play",
    appId: "1:1052808095459:web:86b4125fda3bbfaee707d6"
  };

  // Only this email is recognized by this page as the admin.
  const ADMIN_EMAIL = "manmohan595120@gmail.com";

  const $ = id => document.getElementById(id);

  let auth;
  let db;
  let isAdmin = false;
  let allApps = [];

  function setStatus(message) {
    $("status").textContent = message;
  }

  function safeText(value) {
    return String(value ?? "");
  }

  function makeElement(tag, text = "", className = "") {
    const element = document.createElement(tag);
    element.textContent = text;

    if (className) {
      element.className = className;
    }

    return element;
  }

  function validHttpUrl(value) {
    try {
      const url = new URL(value);

      if (url.protocol === "https:" || url.protocol === "http:") {
        return url.href;
      }
    } catch (error) {
      // Invalid URL
    }

    return null;
  }

  async function loadApps() {
    $("appStatus").textContent = "Loading apps...";
    $("appList").replaceChildren();

    try {
      const result = await getDocs(
        query(
          collection(db, "apps"),
          orderBy("createdAt", "desc")
        )
      );

      allApps = result.docs.map(item => ({
        id: item.id,
        ...item.data()
      }));

      showApps();

    } catch (error) {
      $("appStatus").textContent =
        "Could not load apps. Check Firestore database and security rules.";

      console.error("Load apps error:", error);
    }
  }

  window.showApps = function () {
    const term = $("search").value.trim().toLowerCase();
    const list = $("appList");

    list.replaceChildren();

    const filtered = allApps.filter(item =>
      safeText(item.name).toLowerCase().includes(term) ||
      safeText(item.category).toLowerCase().includes(term) ||
      safeText(item.description).toLowerCase().includes(term)
    );

    $("appStatus").textContent =
      filtered.length + " app(s) found.";

    if (!filtered.length) {
      list.appendChild(
        makeElement("p", "No apps found yet.")
      );
      return;
    }

    filtered.forEach(item => {
      const card = makeElement("div", "", "card");

      card.appendChild(
        makeElement("h3", safeText(item.name))
      );

      card.appendChild(
        makeElement(
          "p",
          "Category: " + safeText(item.category)
        )
      );

      card.appendChild(
        makeElement("p", safeText(item.description))
      );

      const validUrl = validHttpUrl(item.url);

      if (validUrl) {
        const link = makeElement("a", "Visit Official Website");

        link.href = validUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        card.appendChild(link);
      }

      if (isAdmin) {
        const deleteButton = makeElement(
          "button",
          "Delete App",
          "danger"
        );

        deleteButton.addEventListener("click", async () => {
          if (!isAdmin || !auth.currentUser) {
            return;
          }

          if (!confirm("Are you sure you want to delete this app?")) {
            return;
          }

          try {
            await deleteDoc(doc(db, "apps", item.id));
            await loadApps();

          } catch (error) {
            alert(
              "Delete failed. Check Firestore security rules."
            );

            console.error("Delete app error:", error);
          }
        });

        card.appendChild(deleteButton);
      }

      list.appendChild(card);
    });
  };

  $("loginForm").addEventListener("submit", async event => {
    event.preventDefault();

    const email = $("email").value.trim();
    const password = $("password").value;

    if (!email || !password) {
      setStatus("Enter your email and password.");
      return;
    }

    $("loginBtn").disabled = true;
    setStatus("Signing in...");

    try {
      await signInWithEmailAndPassword(auth, email, password);
      setStatus("Login successful.");

    } catch (error) {
      setStatus(
        "Login failed: " +
        (error.code || error.message || "Unknown error")
      );

      console.error("Login error:", error);

    } finally {
      $("loginBtn").disabled = false;
    }
  });

  $("logoutBtn").addEventListener("click", async () => {
    try {
      await signOut(auth);

    } catch (error) {
      setStatus("Logout failed: " + (error.code || error.message));
    }
  });

  $("appForm").addEventListener("submit", async event => {
    event.preventDefault();

    if (!isAdmin || !auth.currentUser) {
      $("adminStatus").textContent =
        "Please sign in with the admin account.";
      return;
    }

    const name = $("appName").value.trim();
    const category = $("appCategory").value.trim();
    const description = $("appDescription").value.trim();
    const url = validHttpUrl($("appUrl").value.trim());

    if (!name || !category || !description || !url) {
      $("adminStatus").textContent =
        "Enter all details and a valid HTTP/HTTPS URL.";
      return;
    }

    $("addBtn").disabled = true;
    $("adminStatus").textContent = "Adding app...";

    try {
      await addDoc(collection(db, "apps"), {
        name,
        category,
        description,
        url,
        createdAt: serverTimestamp()
      });

      $("appForm").reset();
      $("adminStatus").textContent = "App added successfully.";

      await loadApps();

    } catch (error) {
      $("adminStatus").textContent =
        "Could not add app: " +
        (error.code || error.message || "Unknown error");

      console.error("Add app error:", error);

    } finally {
      $("addBtn").disabled = false;
    }
  });

  async function startApp() {
    try {
      if (
        !firebaseConfig.apiKey ||
        firebaseConfig.apiKey === "PASTE_YOUR_ACTUAL_API_KEY_HERE"
      ) {
        throw new Error("Add your actual Firebase API key in the code.");
      }

      const app = initializeApp(firebaseConfig);

      auth = getAuth(app);
      db = getFirestore(app);

      onAuthStateChanged(auth, async user => {
        isAdmin = Boolean(
          user &&
          user.email &&
          user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()
        );

        $("admin").classList.toggle("hidden", !isAdmin);
        $("logoutBtn").classList.toggle("hidden", !user);

        if (user) {
          $("adminEmail").textContent =
            "Signed in as: " + safeText(user.email);

          if (isAdmin) {
            setStatus("Admin account signed in.");
          } else {
            setStatus(
              "Signed in, but this account is not the admin."
            );
          }

        } else {
          $("adminEmail").textContent = "";
          setStatus("Please log in to manage apps.");
        }

        await loadApps();
      });

    } catch (error) {
      setStatus(
        "Setup error: " +
        (error.message || error.code || "Unknown error")
      );

      $("appStatus").textContent =
        "Firebase setup needs attention.";

      console.error("Setup error:", error);
    }
  }

  startApp();
</script>

</body>
</html>
