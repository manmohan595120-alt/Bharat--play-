    <button id="addBtn">Add App</button>
    <button id="logoutBtn" style="background:#555">
      Logout
    </button>

    <h3>Your Added Apps</h3>

  </section>

  <h2>Explore Apps</h2>

    </button>

      Education
    </button>
    <button class="category" data-category="Games">
      Games
    </button>
    <button class="category" data-category="Entertainment">
      Entertainment
    </button>
    <button class="category" data-category="Tools">
      Tools
    </button>
    <button class="category" data-category="Finance">
      Finance
    </button>
  </div>

    No apps found. Try another search.
  </p>

</main>

<footer>

/* HTML-safe text */

function safeText(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}


/* Only allow normal HTTPS links */

function validUrl(value) {
  try {
    const parsed = new URL(value);
    return parsed.protocol === "https:";
  } catch {
    return false;
  }
}


/* Load custom apps from Firestore */

async function loadApps() {
  try {

      id: item.id,
      ...item.data(),
      custom: true
    }));

    apps = [...starterApps, ...customApps];
