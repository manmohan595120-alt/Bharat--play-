<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7f8;color:#202124}
 <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js");
  });
}
</script>
header{background:#087f5b;color:white;padding:16px;position:sticky;top:0;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:23px;font-weight:bold}
button{cursor:pointer}
.admin{background:transparent;color:white;border:1px solid white;padding:9px;border-radius:20px}
input,textarea,select{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #ccc;border-radius:9px;font-size:15px}
#search{border:0;border-radius:25px;margin-top:15px}
main{max-width:1100px;margin:auto;padding:15px}
.categories{display:flex;gap:8px;overflow-x:auto;padding:8px 0 15px}
.cat{white-space:nowrap;background:white;border:1px solid #ddd;border-radius:20px;padding:10px 14px}
.cat.active,.green{background:#087f5b;color:white;border:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.card{background:white;border-radius:14px;padding:14px 9px;text-align:center;box-shadow:0 2px 8px #0000000b;overflow-wrap:anywhere}
.icon{font-size:31px;width:58px;height:58px;margin:auto;background:#e1f5ec;border-radius:16px;display:grid;place-items:center}
.card h3{font-size:15px;margin:10px 0 5px}
.card p{font-size:12px;color:#666;min-height:28px}
.download{display:inline-block;background:#087f5b;color:white;text-decoration:none;padding:10px;border-radius:20px;font-size:12px}
.panel{background:white;padding:16px;margin:16px 0;border-radius:14px}
.panel button{padding:11px;border:0;border-radius:8px;margin:3px}
.hidden{display:none}
.status{overflow-wrap:anywhere;font-size:14px}
footer{text-align:center;background:#e9efec;padding:22px}
</style>
</head>
<body>
<header>
 <div class="top">
  <div class="logo">🇮🇳 Bharat Play</div>
  <button class="admin" id="loginOpen">Admin Login</button>
 </div>
 <input id="search" placeholder="🔍 Search apps and games...">
</header>

<main>
<section id="loginPanel" class="panel hidden">
 <h3>Admin Login</h3>
 <input id="email" type="email" placeholder="Admin email">
 <input id="password" type="password" placeholder="Password">
 <button class="green" id="loginBtn">Login</button>
 <button id="resetBtn">Reset Password</button>
 <button id="closeLogin">Close</button>
 <p id="loginStatus" class="status"></p>
</section>

<section id="adminPanel" class="panel hidden">
 <h2>Admin Panel</h2>
 <p>Welcome, Admin!</p>
 <h3>Add New App</h3>
 <input id="appName" placeholder="App Name">
 <textarea id="appDescription" placeholder="App Description"></textarea>
 <select id="appCategory">
  <option>Social</option><option>Education</option><option>Games</option>
  <option>Entertainment</option><option>Tools</option><option>Finance</option>
  <option>Shopping</option><option>Other</option>
 </select>
 <input id="appUrl" type="url" placeholder="Official website or download URL (https://...)">
 <button class="green" id="addBtn">Add App</button>
 <button id="logoutBtn">Logout</button>
 <p id="adminStatus" class="status"></p>
 <h3>Your Added Apps</h3><div id="adminApps"></div>
</section>

<h2>Explore Apps & Games</h2>
<div class="categories" id="categories">
 <button class="cat active" data-cat="All">All Apps</button>
 <button class="cat" data-cat="Social">Social</button>
 <button class="cat" data-cat="Education">Education</button>
 <button class="cat" data-cat="Games">Games</button>
 <button class="cat" data-cat="Entertainment">Entertainment</button>
 <button class="cat" data-cat="Tools">Tools</button>
 <button class="cat" data-cat="Finance">Finance</button>
 <button class="cat" data-cat="Shopping">Shopping</button>
</div>
<div id="grid" class="grid"></div>
<p id="empty" class="hidden">No apps found.</p>
</main>

<footer>
 <b>Bharat Play</b>
 <p>Discover apps, games and useful tools.</p>
 <small>Downloads open the listed official website. Actual APK availability depends on the app provider.</small>
</footer>
