<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087f5b">
<meta name="description" content="Bharat Play - Discover apps, games and useful tools.">
<title>Bharat Play - Apps Store</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7f6;color:#202124}
header{background:#087f5b;color:white;padding:18px 15px}
header h1{margin:0;font-size:27px}
header p{margin:6px 0 0;font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
button{border:0;border-radius:8px;padding:11px 14px;cursor:pointer;font-weight:bold}
#loginBtn{background:white;color:#087f5b}
.searchbox{padding:14px;background:white;position:sticky;top:0;z-index:5}
#search{width:100%;padding:13px;border:1px solid #d4dcd7;border-radius:25px;font-size:16px}
#filters{display:flex;gap:8px;overflow:auto;padding:12px}
.filter{white-space:nowrap;background:white;border:1px solid #d8e0db}
.filter.active{background:#087f5b;color:white}
h2{font-size:20px;margin:14px}
#count{margin:0 14px;color:#64716a;font-size:13px}
#appGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px}
.card{background:white;border-radius:13px;padding:13px;box-shadow:0 2px 7px #0000000d;min-width:0}
.icon{width:55px;height:55px;border-radius:14px;background:#e0f3e9;display:flex;align-items:center;justify-content:center;font-size:27px;margin-bottom:10px}
.card h3{font-size:16px;margin:5px 0}
.category{font-size:12px;color:#087f5b;font-weight:bold}
.card p{font-size:13px;color:#626b65;line-height:1.45;min-height:36px;overflow-wrap:anywhere}
.actions{display:flex;flex-direction:column;gap:7px}
.actions a,.actions button{display:block;text-align:center;text-decoration:none;border-radius:8px;padding:10px 5px;font-size:13px}
.open{background:#087f5b;color:white}
.store{background:#e8f4ed;color:#075f43}
#empty{text-align:center;padding:30px;display:none}
footer{text-align:center;padding:25px;color:#65716b;font-size:13px}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:center;justify-content:center;padding:18px}
.modalbox{background:white;border-radius:15px;padding:20px;width:100%;max-width:400px}
.modalbox input,.modalbox select{width:100%;padding:12px;margin:7px 0;border:1px solid #ccd5cf;border-radius:8px;font-size:15px}
.primary{background:#087f5b;color:white;width:100%;margin-top:8px}
.secondary{background:#e9eeeb;width:100%;margin-top:8px}
.notice{font-size:12px;color:#68736d;line-height:1.5}
#adminPanel{display:none;padding:14px;background:white;margin:12px;border-radius:12px}
@media(min-width:650px){#appGrid{grid-template-columns:repeat(4,minmax(0,1fr))}header{padding-left:6%;padding-right:6%}}
</style>
</head>

<body>
<header>
  <div class="top">
    <div>
      <h1>🇮🇳 Bharat Play</h1>
      <p>Discover apps, games and useful tools</p>
    </div>
    <button id="loginBtn">Admin Login</button>
  </div>
</header>

<div class="searchbox">
  <input id="search" type="search" placeholder="🔍 Search apps and games...">
</div>

<div id="filters"></div>

<h2>Popular Apps & Games</h2>
<div id="count">Loading apps...</div>
<div id="appGrid"></div>
<div id="empty">कोई ऐप नहीं मिली। दूसरा नाम खोजें।</div>

<section id="adminPanel">
  <h2>Admin Panel</h2>
  <p>नई ऐप जोड़ें</p>
  <input id="appName" placeholder="App name">
  <input id="appDescription" placeholder="App description">
  <input id="appCategory" placeholder="Category, जैसे Social">
  <input id="appUrl" type="url" placeholder="Official website URL (https://...)">
  <input id="appIcon" placeholder="Emoji icon, जैसे 📱">
  <button id="addBtn" class="primary">Add App</button>
  <button id="logoutBtn" class="secondary">Logout</button>
  <p class="notice">ऐप जोड़ने के लिए Firebase Firestore
